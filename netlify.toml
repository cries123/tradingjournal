[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  PLAYWRIGHT_BROWSERS_PATH = ".cache/ms-playwright"

[build.cache]
  paths = [".cache/ms-playwright"]

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "https://www.trendchasers.net/*"
  to = "https://trendchasers.net/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Published track records are served by a function so their Open Graph tags are in the HTML.
# Link-preview crawlers do not run JavaScript, so without this every shared record previews as
# the homepage card. Must stay ABOVE the SPA catch-all: Netlify takes the first match.
[[redirects]]
  from = "/r/*"
  to = "/.netlify/functions/record-preview"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
