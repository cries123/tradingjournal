<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tcg" x1="14" y1="50" x2="48" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0B0E14"/>
  <!-- One rising stroke. Thick and rounded so it survives being scaled to 16px, where thin
       geometry and fine detail turn to noise. -->
  <path d="M14 46 L27 33 L36 41 L47 27"
        fill="none" stroke="url(#tcg)" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrowhead is a solid triangle, sized to read as a distinct shape rather than a stroke end. -->
  <path d="M52 16 L52 34 L34 16 Z" fill="#38bdf8"/>
</svg>
