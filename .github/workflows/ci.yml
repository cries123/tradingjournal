name: CI

# Runs the same checks a deploy would, before a deploy happens.
#
# Netlify builds whatever lands on main and publishes it. That means the first thing that tells us
# a change is broken is the live site, and the people who find out are traders in the middle of
# their journal. This runs `tsc`, eslint, the unit tests and a full production build on every push
# and every pull request, so a break is caught in about two minutes on GitHub instead of in
# production.
on:
  push:
    branches: [main]
  pull_request:
  # So a red check can be re-run from the Actions tab without an empty commit.
  workflow_dispatch:

# A second push while the first is still running makes the first result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci`, not `install`: it installs exactly what package-lock.json pins and fails if the
      # lockfile and package.json have drifted, which is its own class of "works on my machine".
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck tests
        run: npm run typecheck:tests

      # The server/ and netlify/ code is bundled by Netlify's esbuild, which strips types without
      # checking them — so nothing else in the pipeline would ever notice a type error there.
      - name: Typecheck server and functions
        run: npm run typecheck:server

      - name: Unit tests
        run: npm test

      # Runs `tsc -b` over the app and a real Vite production build, which is the check that
      # matters most: it is the exact command Netlify runs. The prerender step is skipped because
      # it drives a real browser to snapshot the marketing pages — worth the minute on a deploy,
      # not on every pull request, and its output is never published from here.
      - name: Production build
        run: npm run build
        env:
          SKIP_PRERENDER: '1'
          COMMIT_REF: ${{ github.sha }}
